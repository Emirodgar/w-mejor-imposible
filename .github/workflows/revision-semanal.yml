name: Revisión semanal del portal

on:
  schedule:
    # Cada lunes a las 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: revision-semanal
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Revisión (páginas, enlaces, fuentes y calendario)
        id: revision
        run: python scripts/portal/revision_semanal.py

      - name: Guardar el informe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: informe-revision
          path: informe-revision.md
          retention-days: 30

      - name: Guardar el estado de las fuentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portal/estado-fuentes.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado de las fuentes."
          else
            git commit -m "Actualiza el estado de las fuentes (revisión semanal)"
            git pull --rebase -q
            git push
          fi

      - name: Abrir, actualizar o cerrar el aviso
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMAS: ${{ steps.revision.outputs.problemas }}
        run: |
          TITULO="Revisión semanal del portal"
          NUM=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ "${PROBLEMAS:-0}" -gt 0 ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file informe-revision.md
              gh issue comment "$NUM" --body "Actualizado por la revisión del $(date -u +%F): hay ${PROBLEMAS} apartados con avisos."
            else
              gh issue create --title "$TITULO" --body-file informe-revision.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "La revisión del $(date -u +%F) no encontró avisos. Se cierra."
            gh issue close "$NUM"
          else
            echo "Sin avisos."
          fi
