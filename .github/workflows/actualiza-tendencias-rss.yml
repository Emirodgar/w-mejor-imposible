name: Actualiza tendencias de noticias (RSS Porsche)

on:
  schedule:
    # Varios lanzadores al día (UTC). GitHub puede retrasar o saltarse disparos
    # programados, así que se redundan; el primer paso del job solo deja
    # continuar a uno: el primero que encuentre que han pasado 24 h o más
    # desde el último commit de tendencias.
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'
    - cron: '17 16 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch: {} # permite ejecutarla a mano en cualquier momento

permissions:
  contents: write

concurrency:
  group: actualiza-tendencias-rss
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar que han pasado 24 h desde la última actualización
        id: hora
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Ejecución manual: se ejecuta siempre."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ULTIMO=$(git log -1 --format=%ct --grep="^Actualiza tendencias con noticias recientes" || true)
          AHORA=$(date +%s)
          if [ -n "$ULTIMO" ] && [ $((AHORA - ULTIMO)) -lt 86400 ]; then
            echo "Última actualización hace $(( (AHORA - ULTIMO) / 3600 )) h (<24 h). Se omite."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Han pasado 24 h o más (o no hay commits previos). Se ejecuta."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.hora.outputs.ejecutar == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar tendencias con Gemini
        if: steps.hora.outputs.ejecutar == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/actualiza-tendencias-gemini.js

      - name: Commit y push si hay cambios
        if: steps.hora.outputs.ejecutar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add porsche/tendencias.html porsche/tendencias-catalogo.json porsche/tendencias-editorial.json porsche/tendencias-semanas.json porsche/tendencias sitemap.xml .claude/state/tendencias-rss-seen.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualiza tendencias con noticias recientes (RSS + Gemini)"
            # El workflow de "última hora" también empuja a main y toca el mismo
            # archivo: se rebasa antes de subir para evitar rechazos por adelantado.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
