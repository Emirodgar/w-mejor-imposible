name: Actualiza noticias de última hora (Porsche)

on:
  schedule:
    # Cada 5 horas (UTC): 00, 05, 10, 15, 20h
    - cron: '0 */5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar bloque de última hora desde el RSS
        run: node scripts/actualiza-ultima-hora.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add porsche/tendencias.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualiza noticias de última hora (RSS Porsche)"
            git push
          fi
