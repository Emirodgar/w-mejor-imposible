name: Vigilancia diaria de eventos (RSS + Gemini)

on:
  schedule:
    # Cada día a las 05:30 UTC (06:30 o 07:30 en España)
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Solo listar candidatos (no llama a Gemini ni cambia nada)'
        type: boolean
        default: false
      enriquecer_max:
        description: 'Fichas a enriquecer en esta ejecución (por defecto 6; súbelo para completar las existentes de golpe)'
        type: string
        default: '6'

permissions:
  contents: write

concurrency:
  group: vigilancia-eventos
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recoger, extraer con Gemini, crear o enriquecer fichas y reconstruir el portal
        id: vigilancia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          MAX_ARTICULOS: '30'
          ENRIQUECER_MAX: ${{ inputs.enriquecer_max || '6' }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            python -X utf8 scripts/vigilancia/pipeline.py --dry
          else
            python -X utf8 scripts/vigilancia/pipeline.py
          fi

      - name: Guardar el informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-vigilancia
          path: data/portal/vigilancia/informes/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit y push si hay cambios
        if: inputs.dry != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Vigilancia de eventos: ${{ steps.vigilancia.outputs.creados || 0 }} fichas nuevas, ${{ steps.vigilancia.outputs.actualizados || 0 }} enriquecidas"
            # Otros workflows publican en main: reintegrar antes de subir.
            git pull --rebase
            git push
          fi
