name: Recoge precios de anuncios (Porsche, España)

on:
  schedule:
    # Día 1 de cada mes, 06:15 UTC
    - cron: '15 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precios-anuncios
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recoger el punto mensual (solo añade, no toca el histórico)
        run: python scripts/actualizar-precios-anuncios/recoger.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add porsche/precios-anuncios.json scripts/actualizar-precios-anuncios/snapshots
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Añade punto mensual de precios de anuncios"
            # Otros workflows publican en main: reintegrar antes de subir.
            git pull --rebase
            git push
          fi
